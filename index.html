<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коммерческое предложение — Vestfrost VFC814T30W</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- БАЗА --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0ede8;
            background-image:
                radial-gradient(circle at 20% 0%, rgba(201, 185, 154, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(168, 180, 200, 0.15) 0%, transparent 50%);
            color: #2a2724;
            line-height: 1.6;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        .card {
            max-width: 1020px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow:
                0 1px 2px rgba(0,0,0,0.04),
                0 12px 32px rgba(0,0,0,0.06),
                0 40px 80px rgba(0,0,0,0.04);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            animation: cardEnter 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }
        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- ДЕКОРАТИВНАЯ ПОЛОСА СВЕРХУ --- */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #c9b99a, #a8b4c8, #c9b99a);
            background-size: 200% 100%;
            animation: shimmer 6s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* --- ХЕДЕР --- */
        .header {
            padding: 56px 48px 44px;
            background: linear-gradient(160deg, #fdfcfa 0%, #f7f4ef 100%);
            border-bottom: 1px solid #ede8e0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(201,185,154,0.08) 0%, transparent 60%);
            animation: headerGlow 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes headerGlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10%, 10%); }
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 3px;
            background: #c9b99a;
            border-radius: 3px;
            animation: lineGrow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
        }
        @keyframes lineGrow {
            from { width: 0; opacity: 0; }
            to { width: 60px; opacity: 1; }
        }
        .header-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #a89a82;
            background: #f5f0e8;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeSlide 0.6s ease-out 0.3s forwards;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header h1 {
            font-size: 34px;
            font-weight: 800;
            color: #2a2724;
            letter-spacing: -0.8px;
            line-height: 1.2;
            opacity: 0;
            animation: fadeSlide 0.6s ease-out 0.4s forwards;
        }
        .header h1 span {
            color: #a89a82;
        }
        .header p {
            font-size: 15px;
            color: #9b9590;
            margin-top: 10px;
            font-weight: 500;
            opacity: 0;
            animation: fadeSlide 0.6s ease-out 0.5s forwards;
        }

        /* --- ФОТО ПЛЕЙСХОЛДЕР --- */
        .photo-placeholder {
            margin: 40px 32px 0;
            height: 360px;
            background: #f1f3f6;
            border-radius: 18px;
            border: 2px dashed #d1d9e6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 14px;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
            opacity: 0;
            animation: fadeSlide 0.6s ease-out 0.6s forwards;
            position: relative;
            overflow: hidden;
        }
        .photo-placeholder:hover {
            background: #e9edf3;
            border-color: #c9b99a;
        }
        .photo-placeholder svg {
            width: 56px;
            height: 56px;
            opacity: 0.35;
        }

        /* --- ТАБЛИЦА --- */
        .table-wrap { padding: 32px 32px 32px; }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
        }

        thead th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #a8a29e;
            padding: 0 20px 12px;
            opacity: 0;
            animation: fadeSlide 0.5s ease-out forwards;
        }
        thead th:nth-child(1) { animation-delay: 0.7s; }
        thead th:nth-child(2) { animation-delay: 0.75s; }
        thead th:nth-child(3) { animation-delay: 0.8s; }
        thead th:nth-child(4) { animation-delay: 0.85s; }
        thead th:last-child { text-align: right; }

        tbody tr {
            background: #fdfcfa;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
            opacity: 0;
            animation: rowEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        tbody tr:nth-child(1) { animation-delay: 0.9s; }
        tbody tr:nth-child(2) { animation-delay: 0.97s; }
        tbody tr:nth-child(3) { animation-delay: 1.04s; }
        tbody tr:nth-child(4) { animation-delay: 1.11s; }
        tbody tr:nth-child(5) { animation-delay: 1.18s; }
        tbody tr:nth-child(6) { animation-delay: 1.25s; }
        tbody tr:nth-child(7) { animation-delay: 1.32s; }
        tbody tr:nth-child(8) { animation-delay: 1.39s; }

        @keyframes rowEnter {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        tbody tr td:first-child {
            border-radius: 14px 0 0 14px;
            border-left: 3px solid transparent;
            transition: border-color 0.3s ease;
        }
        tbody tr td:last-child {
            border-radius: 0 14px 14px 0;
        }

        tbody tr:hover {
            background: #f7f3ec;
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(168, 154, 130, 0.12);
        }
        tbody tr:hover td:first-child {
            border-left-color: #c9b99a;
        }

        tbody td {
            padding: 18px 20px;
            font-size: 14px;
            vertical-align: middle;
        }

        /* --- БРЕНД --- */
        .brand {
            font-weight: 800;
            font-size: 15px;
            color: #2a2724;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #c9b99a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        tbody tr:hover .brand-dot {
            transform: scale(1.4);
            box-shadow: 0 0 0 4px rgba(201, 185, 154, 0.2);
        }

        /* --- МОДЕЛЬ --- */
        .model {
            font-weight: 700;
            color: #5c5652;
            position: relative;
            transition: color 0.3s ease;
            display: inline-block;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.2px;
        }
        .model::after {
            content: '';
            position: absolute;
            bottom: -3px; left: 0;
            width: 0; height: 2px;
            background: linear-gradient(90deg, #c9b99a, #a8b4c8);
            border-radius: 1px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        tbody tr:hover .model { color: #2a2724; }
        tbody tr:hover .model::after { width: 100%; }

        /* --- ЦЕНЫ --- */
        .price-cell { text-align: right; }
        .price {
            font-weight: 800;
            font-size: 17px;
            color: #2a2724;
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }
        tbody tr:hover .price {
            color: #8a7a5c;
        }

        /* --- ИТОГОВАЯ СТРОКА --- */
        .total-row {
            margin-top: 16px;
            padding: 24px 32px;
            background: linear-gradient(135deg, #2a2724, #3d3935);
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            opacity: 0;
            animation: totalEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.55s forwards;
            box-shadow: 0 8px 32px rgba(42, 39, 36, 0.2);
            position: relative;
            overflow: hidden;
        }
        .total-row::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: totalShine 4s ease-in-out infinite;
        }
        @keyframes totalShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        @keyframes totalEnter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .total-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }
        .total-sum {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        /* --- ФУТЕР --- */
        .footer {
            padding: 28px 48px;
            background: linear-gradient(180deg, #fdfcfa, #f7f4ef);
            border-top: 1px solid #ede8e0;
            text-align: center;
            opacity: 0;
            animation: fadeSlide 0.6s ease-out 1.7s forwards;
        }
        .footer-note {
            font-size: 13px;
            color: #9b9590;
            font-weight: 500;
        }

        /* --- АДАПТИВ --- */
        @media (max-width: 750px) {
            body { padding: 20px 10px; }
            .card { border-radius: 20px; }
            .header { padding: 36px 24px 30px; }
            .header h1 { font-size: 24px; }
            .photo-placeholder { margin: 24px 16px 0; height: 220px; }
            .table-wrap { padding: 24px 12px 20px; }
            thead th { font-size: 10px; padding: 0 10px 8px; }
            tbody td { padding: 14px 10px; font-size: 12px; }
            .price { font-size: 14px; }
            .brand { font-size: 13px; }
            .footer { padding: 20px 24px; }
            .total-row {
                padding: 18px 20px;
                flex-direction: column;
                text-align: center;
            }
            .total-sum { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ХЕДЕР -->
    <div class="header">
        <div class="header-badge">Коммерческое предложение</div>
        <h1>Стиральная машина <span>Vestfrost</span></h1>
        <p>VFC814T30W — 8 кг · 1400 об/мин · A+++</p>
    </div>

    <!-- ФОТО ПЛЕЙСХОЛДЕР -->
    <div class="photo-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A1.5 1.5 0 0021.75 19.5V4.5A1.5 1.5 0 0020.25 3H3.75A1.5 1.5 0 002.25 4.5v15A1.5 1.5 0 003.75 21z" />
        </svg>
        <span>Место для фото стиральной машины</span>
    </div>

    <!-- ТАБЛИЦА -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ПОЗИЦИЯ</th>
                    <th>Модель</th>
                    <th>РРЦ</th>
                    <th>Цена</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><div class="brand"><span class="brand-dot"></span>Стиральная машина Vestfrost</div></td>
                    <td><span class="model">VFC814T30W</span></td>
                    <td style="text-align: right; color: #b5afa9; text-decoration: line-through; font-size: 13px;">59 990 ₽</td>
                    <td class="price-cell"><span class="price">54 990 ₽</span></td>
                </tr>
            </tbody>
        </table>

        <!-- ИТОГОВАЯ СТРОКА -->
        <div class="total-row">
            <div class="total-label">Итог</div>
            <div class="total-sum">54 990 ₽</div>
        </div>
    </div>

    <!-- ФУТЕР -->
    <div class="footer">
        <div class="footer-note">Интернет-магазин Своя Техника</div>
    </div>

</div>

</body>
</html>
